<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TSDBuddy Splash</title>
  <style>
    :root {
      --bg-deep: #060d16;
      --bg-mid: #0b1723;
      --panel: rgba(12, 22, 31, 0.92);
      --panel-border: rgba(126, 211, 252, 0.25);
      --text: #ebf7ff;
      --muted: #afd7f4;
      --accent: #7dd3fc;
      --accent-strong: #38bdf8;
      --warm: #f59e0b;
      --success: #34d399;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: radial-gradient(circle at top left, rgba(56, 189, 248, 0.14), transparent 28%),
                  radial-gradient(circle at bottom right, rgba(245, 158, 11, 0.12), transparent 26%),
                  linear-gradient(140deg, var(--bg-deep), var(--bg-mid) 45%, #0f1d2c 100%);
      color: var(--text);
    }

    body {
      display: grid;
      place-items: center;
    }

    .splash-shell {
      width: 500px;
      min-height: 230px;
      padding: 26px 26px 20px;
      border-radius: 26px;
      background: linear-gradient(180deg, rgba(12, 21, 30, 0.9), rgba(8, 15, 21, 0.96));
      border: 1px solid var(--panel-border);
      box-shadow: 0 28px 60px rgba(2, 6, 12, 0.5);
      display: grid;
      place-items: center;
      text-align: center;
      gap: 14px;
    }

    .watch {
      position: relative;
      width: 116px;
      height: 116px;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(125, 211, 252, 0.18);
      box-shadow: inset 0 0 0 1px rgba(125, 211, 252, 0.08), 0 14px 24px rgba(56, 189, 248, 0.18);
      display: grid;
      place-items: center;
    }

    .watch img {
      width: 104px;
      height: 104px;
      display: block;
      filter: drop-shadow(0 12px 18px rgba(56, 189, 248, 0.18));
    }

    .brand {
      display: grid;
      gap: 2px;
    }

    .brand-title {
      font-size: clamp(2rem, 3vw, 2.5rem);
      font-weight: 800;
      letter-spacing: -0.06em;
      color: var(--text);
    }

    .brand-subtitle {
      font-size: 0.9rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .progress {
      width: 220px;
      height: 6px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.18);
      overflow: hidden;
      position: relative;
    }

    .progress > span {
      position: absolute;
      inset: 0 auto 0 0;
      width: 35%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent), var(--success));
      box-shadow: 0 0 18px rgba(52, 211, 153, 0.5);
      animation: loading 1.5s ease-in-out infinite;
    }

    @keyframes loading {
      0% { transform: translateX(-10%); }
      50% { transform: translateX(190%); }
      100% { transform: translateX(-10%); }
    }
  </style>
</head>
<body>
  <div class="splash-shell">
    <div class="watch" aria-hidden="true">
      <img src="stopwatch.png" alt="TSDBuddy stopwatch icon" />
    </div>

    <div class="brand">
      <div class="brand-title">TSDBuddy</div>
      <div class="brand-subtitle">Rally timing simulator</div>
    </div>

    <div class="progress" aria-label="Loading">
      <span></span>
    </div>
  </div>
</body>
</html>
